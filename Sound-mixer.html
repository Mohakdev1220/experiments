<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient Soundscape Mixer</title>
  <style>
    /* CSS: Styling and Layout */
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary-color: #bb86fc;
      --text-main: #ffffff;
      --text-muted: #a0a0a0;
      --slider-track: #333333;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .mixer-container {
      background-color: var(--card-bg);
      padding: 2rem 3rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      margin: 2rem 0;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--primary-color);
    }

    .header p {
      margin: 5px 0 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .track {
      background: rgba(255, 255, 255, 0.05);
      padding: 1.2rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      transition: background 0.3s ease;
    }

    .track.active {
      background: rgba(187, 134, 252, 0.1);
      border: 1px solid rgba(187, 134, 252, 0.3);
    }

    .track-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .track-name {
      font-size: 1.1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      background-color: transparent;
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 5px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      background-color: var(--primary-color);
      color: var(--bg-color);
    }

    .play-btn.playing {
      background-color: var(--primary-color);
      color: var(--bg-color);
    }

    /* Slider Styling */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: var(--slider-track);
      border-radius: 3px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--primary-color);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -5px;
      box-shadow: 0 0 5px rgba(187, 134, 252, 0.5);
    }
  </style>
</head>
<body>

  <div class="mixer-container">
    <div class="header">
      <h1>Custom Soundscape</h1>
      <p>Mix your environment</p>
    </div>

    <!-- Railway Station -->
    <div class="track" id="track-railway">
      <div class="track-top">
        <span class="track-name">🚉 Railway Station</span>
        <button class="play-btn" onclick="togglePlay('railway', this)">Play</button>
      </div>
      <input type="range" id="vol-railway" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('railway', this.value)">
      <audio id="audio-railway" loop src="railway.mp3"></audio>
    </div>

    <!-- Monsoon Rain -->
    <div class="track" id="track-rain">
      <div class="track-top">
        <span class="track-name">🌧️ Rain</span>
        <button class="play-btn" onclick="togglePlay('rain', this)">Play</button>
      </div>
      <input type="range" id="vol-rain" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('rain', this.value)">
      <audio id="audio-rain" loop src="rain.mp3"></audio>
    </div>

    <!-- Highway -->
    <div class="track" id="track-highway">
      <div class="track-top">
        <span class="track-name">🛣️ Highway</span>
        <button class="play-btn" onclick="togglePlay('highway', this)">Play</button>
      </div>
      <input type="range" id="vol-highway" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('highway', this.value)">
      <audio id="audio-highway" loop src="highway.mp3"></audio>
    </div>

    <!-- Crowd -->
    <div class="track" id="track-crowd">
      <div class="track-top">
        <span class="track-name">👥 Crowd</span>
        <button class="play-btn" onclick="togglePlay('crowd', this)">Play</button>
      </div>
      <input type="range" id="vol-crowd" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('crowd', this.value)">
      <audio id="audio-crowd" loop src="crowd.mp3"></audio>
    </div>

    <!-- Chaiwala -->
    <div class="track" id="track-chaiwala">
      <div class="track-top">
        <span class="track-name">☕ Chaiwala</span>
        <button class="play-btn" onclick="togglePlay('chaiwala', this)">Play</button>
      </div>
      <input type="range" id="vol-chaiwala" min="0" max="1" step="0.01" value="0.5" oninput="setVolume('chaiwala', this.value)">
      <audio id="audio-chaiwala" loop src="chaiwala.mp3"></audio>
    </div>

  </div>

  <script>
    // JavaScript: Audio Controls Logic

    // Set initial volumes matching the sliders (50%)
    window.onload = () => {
      document.getElementById('audio-railway').volume = 0.5;
      document.getElementById('audio-rain').volume = 0.5;
      document.getElementById('audio-highway').volume = 0.5;
      document.getElementById('audio-crowd').volume = 0.5;
      document.getElementById('audio-chaiwala').volume = 0.5;
    };

    function togglePlay(trackName, btnElement) {
      const audio = document.getElementById(`audio-${trackName}`);
      const trackContainer = document.getElementById(`track-${trackName}`);

      if (audio.paused) {
        audio.play();
        btnElement.textContent = 'Pause';
        btnElement.classList.add('playing');
        trackContainer.classList.add('active');
      } else {
        audio.pause();
        btnElement.textContent = 'Play';
        btnElement.classList.remove('playing');
        trackContainer.classList.remove('active');
      }
    }

    function setVolume(trackName, volumeValue) {
      const audio = document.getElementById(`audio-${trackName}`);
      audio.volume = volumeValue;
    }
  </script>
</body>
</html>
