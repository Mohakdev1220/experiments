<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop <-> Mobile Live Chat</title>
  <!-- PeerJS Library for Browser-to-Browser Connection -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
    body { max-width: 500px; margin: 20px auto; padding: 15px; background: #f1f5f9; }
    .card { background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #0f172a; text-align: center; }
    
    .id-box { background: #e2e8f0; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
    .id-box strong { font-size: 1.2rem; color: #2563eb; letter-spacing: 1px; }

    .field { margin-bottom: 12px; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; color: #475569; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
    
    button { width: 100%; padding: 12px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; }
    .btn-connect { background: #2563eb; color: white; margin-bottom: 15px; }
    .btn-send { background: #10b981; color: white; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }

    #status { padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; text-align: center; margin-bottom: 12px; }
    .disconnected { background: #fef2f2; color: #ef4444; }
    .connected { background: #ecfdf5; color: #10b981; }

    /* Chat Window */
    #chat-box {
      height: 250px; background: #0f172a; border-radius: 8px; padding: 12px;
      overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; font-size: 0.9rem; word-break: break-word; }
    .msg-me { background: #2563eb; color: white; align-self: flex-end; }
    .msg-partner { background: #334155; color: #f8fafc; align-self: flex-start; }
    .msg-sys { color: #94a3b8; font-size: 0.75rem; text-align: center; align-self: center; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Laptop <-> Mobile Chat</h2>

    <!-- Connection Status -->
    <div id="status" class="disconnected">Status: Generating ID...</div>

    <!-- Your Generated Peer ID -->
    <div class="id-box">
      <span>Your Device ID:</span><br>
      <strong id="my-id">...</strong>
    </div>

    <!-- Connect to Partner -->
    <div class="field">
      <label for="peer-id-input">Enter Partner's Device ID:</label>
      <input type="text" id="peer-id-input" placeholder="Paste ID here...">
    </div>
    <button class="btn-connect" id="connect-btn" onclick="connectToPeer()">Connect Devices</button>

    <!-- Chat Messages Window -->
    <div id="chat-box">
      <div class="msg msg-sys">Open this same page on both Laptop and Mobile.</div>
    </div>

    <!-- Message Input -->
    <div class="field">
      <input type="text" id="message-input" placeholder="Type message..." disabled onkeydown="if(event.key === 'Enter') sendMessage()">
    </div>
    <button class="btn-send" id="send-btn" onclick="sendMessage()" disabled>Send Message</button>
  </div>

  <script>
    let peer = null;
    let conn = null;

    // Generate random 4-digit code for easy typing
    const randomId = Math.floor(1000 + Math.random() * 9000).toString();

    // Initialize PeerJS Connection
    peer = new Peer(randomId);

    peer.on('open', (id) => {
      document.getElementById('my-id').textContent = id;
      updateStatus("Disconnected (Ready to connect)", "disconnected");
    });

    // Listen for incoming connection from other device
    peer.on('connection', (incomingConn) => {
      conn = incomingConn;
      setupConnectionHandlers();
    });

    peer.on('error', (err) => {
      logSystem(`Error: ${err.type}`);
    });

    function connectToPeer() {
      const targetId = document.getElementById('peer-id-input').value.trim();
      if (!targetId) return;

      updateStatus("Connecting...", "disconnected");
      conn = peer.connect(targetId);
      setupConnectionHandlers();
    }

    function setupConnectionHandlers() {
      conn.on('open', () => {
        updateStatus("Connected! Live Messaging Active", "connected");
        document.getElementById('message-input').disabled = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('connect-btn').disabled = true;
        logSystem("Connection established!");
      });

      // Receive Message
      conn.on('data', (data) => {
        appendMessage(data, 'partner');
      });

      conn.on('close', () => {
        updateStatus("Partner Disconnected", "disconnected");
        document.getElementById('message-input').disabled = true;
        document.getElementById('send-btn').disabled = true;
        document.getElementById('connect-btn').disabled = false;
        logSystem("Connection closed.");
      });
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();

      if (text && conn && conn.open) {
        conn.send(text); // Send data instantly over WebRTC
        appendMessage(text, 'me');
        input.value = '';
      }
    }

    function appendMessage(text, sender) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg msg-${sender}`;
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logSystem(text) {
      const chatBox = document.getElementById('chat-box');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg msg-sys';
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateStatus(text, className) {
      const status = document.getElementById('status');
      status.textContent = `Status: ${text}`;
      status.className = className;
    }
  </script>
</body>
</html>
