<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Reticle - Normal View & Blast Effects</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        /* 16:9 Uncropped Responsive Frame */
        .viewport-wrapper {
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .game-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* Fits 16:9 ratio perfectly inside screen without cropping/zooming webcam */
            max-width: calc(100dvh * (16 / 9));
            max-height: calc(100vw * (9 / 16));
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #050b14;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }

        /* Video and Overlay Canvas */
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Normal FOV - No Zoom */
            transform: scaleX(-1); /* Mirror view */
        }

        /* Visual Flash Layer */
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.35);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s ease-out;
            z-index: 15;
        }

        /* HUD Status Pill */
        .hud-header {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            pointer-events: none;
        }

        .status-pill {
            background: rgba(8, 15, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 8px 16px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 13px;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #f59e0b;
            box-shadow: 0 0 10px #f59e0b;
        }

        /* Controls Area */
        .controls-layer {
            position: absolute;
            bottom: 24px;
            z-index: 20;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .shoot-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #ffffff;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 16px 48px;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .shoot-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 45px rgba(255, 0, 85, 1);
        }

        /* Recoil Camera Shake */
        .shake {
            animation: cameraRecoil 0.12s ease-in-out;
        }

        @keyframes cameraRecoil {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 6px); }
            40% { transform: translate(8px, -6px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(4px, 3px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div class="viewport-wrapper">
        <div class="game-container" id="gameViewport">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="outputCanvas"></canvas>
            <div class="flash-overlay" id="flashOverlay"></div>

            <div class="hud-header">
                <div class="status-pill">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">CONNECTING AI...</span>
                </div>
            </div>

            <div class="controls-layer">
                <button class="shoot-btn" id="shootBtn">SHOOT</button>
            </div>
        </div>
    </div>

    <!-- MediaPipe Vision Task Library -->
   <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("outputCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const shootBtn = document.getElementById("shootBtn");
    const viewport = document.getElementById("gameViewport");
    const flashOverlay = document.getElementById("flashOverlay");

    let faceLandmarker = null;
    let lastVideoTime = -1;
    let rotationAngle = 0;

    // Smooth position interpolation (Lerp)
    let targetPos = { x: 0, y: 0, detected: false };
    let smoothedPos = { x: 0, y: 0 };
    const lerpSpeed = 0.45; // Enhanced lock speed & response

    // Special Effects Array lists
    let particles = [];
    let shockwaves = [];
    let lasers = [];
    let floatingTexts = [];

    // Preload shoot sound base (.wav)
    const shootAudioBase = new Audio("shoot.wav");

    function playShootAudio() {
        // Clone node allows rapid-fire audio without clipping previous sound
        const soundInstance = shootAudioBase.cloneNode();
        soundInstance.volume = 1.0;
        soundInstance.play().catch(() => playFallbackSynthesizer());
    }

    // Web Audio Synthesizer Fallback if shoot.wav fails to load or is blocked
    function playFallbackSynthesizer() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const audioCtx = new AudioCtx();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.2);

            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } catch (e) {}
    }

    async function initCameraAI() {
        try {
            const filesetResolver = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );

            faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numFaces: 1
            });

            statusText.innerText = "SYSTEM ACTIVE - LOCK ON";
            statusText.style.color = "#38bdf8";
            statusDot.style.backgroundColor = "#22c55e";
            statusDot.style.boxShadow = "0 0 10px #22c55e";

            startCamera();
        } catch (err) {
            statusText.innerText = "CAMERA / AI ERROR";
            statusText.style.color = "#ef4444";
            statusDot.style.backgroundColor = "#ef4444";
        }
    }

    async function startCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.addEventListener("loadeddata", renderLoop);
        } catch (err) {
            alert("Please grant camera permissions to use the app.");
        }
    }

    function triggerBlast() {
        // Play Audio
        playShootAudio();

        // Screen Muzzle Flash & Recoil Shake
        flashOverlay.style.opacity = "1";
        setTimeout(() => { flashOverlay.style.opacity = "0"; }, 60);

        viewport.classList.remove("shake");
        void viewport.offsetWidth; // Force CSS reflow
        viewport.classList.add("shake");

        // Origin position (Shoot button base)
        const originX = canvas.width / 2;
        const originY = canvas.height - 40;

        const targetX = targetPos.detected ? smoothedPos.x : canvas.width / 2;
        const targetY = targetPos.detected ? smoothedPos.y : canvas.height / 2;

        // 1. Fire High Voltage Energy Laser Beam
        lasers.push({
            x1: originX,
            y1: originY,
            x2: targetX,
            y2: targetY,
            alpha: 1,
            width: 12
        });

        // 2. Forehead Explosion & Shockwaves
        shockwaves.push(
            { x: targetX, y: targetY, radius: 10, maxRadius: 100, alpha: 1, color: "#ffffff", strokeWidth: 8 },
            { x: targetX, y: targetY, radius: 5, maxRadius: 60, alpha: 1, color: "#ff0055", strokeWidth: 5 }
        );

        // 3. Floating Damage Indicator Text
        const dmgValues = ["CRITICAL HIT!", "TARGET ELIMINATED", "-9999 HP", "HEADSHOT!"];
        floatingTexts.push({
            text: dmgValues[Math.floor(Math.random() * dmgValues.length)],
            x: targetX,
            y: targetY - 30,
            alpha: 1,
            vy: -2.5,
            scale: 1.2
        });

        // 4. High-Density Particle Explosion
        const particleCount = 50;
        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 16 + 5;
            particles.push({
                x: targetX,
                y: targetY,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed + (Math.random() * 2 - 1), // Light dispersion
                radius: Math.random() * 6 + 2,
                color: ["#ff0055", "#ff5500", "#ffee00", "#00ffff", "#ffffff"][Math.floor(Math.random() * 5)],
                alpha: 1,
                decay: Math.random() * 0.03 + 0.015,
                gravity: 0.15
            });
        }
    }

    function resizeCanvas() {
        if (canvas.width !== viewport.clientWidth || canvas.height !== viewport.clientHeight) {
            canvas.width = viewport.clientWidth;
            canvas.height = viewport.clientHeight;
        }
    }

    function renderLoop() {
        resizeCanvas();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Process MediaPipe AI Detection
        if (video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            const results = faceLandmarker.detectForVideo(video, performance.now());

            if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                const lm = results.faceLandmarks[0];
                
                // --- HIGH PRECISION FOREHEAD CALCULATION ---
                // Point #10 = Top center of forehead
                // Point #151 = Mid-lower forehead (glabella)
                // Averaging the two produces the absolute dead-center of the forehead slab
                const foreheadX = (lm[10].x + lm[151].x) / 2;
                const foreheadY = (lm[10].y + lm[151].y) / 2;

                targetPos.x = foreheadX * canvas.width;
                targetPos.y = foreheadY * canvas.height;
                targetPos.detected = true;
            } else {
                targetPos.detected = false;
            }
        }

        // Smooth Coordinate Interpolation
        if (targetPos.detected) {
            if (smoothedPos.x === 0 && smoothedPos.y === 0) {
                smoothedPos.x = targetPos.x;
                smoothedPos.y = targetPos.y;
            } else {
                smoothedPos.x += (targetPos.x - smoothedPos.x) * lerpSpeed;
                smoothedPos.y += (targetPos.y - smoothedPos.y) * lerpSpeed;
            }

            drawLockReticle(smoothedPos.x, smoothedPos.y);
        }

        // Render Blast & Weapon FX
        drawEffects();

        requestAnimationFrame(renderLoop);
    }

    function drawLockReticle(x, y) {
        rotationAngle += 0.04;

        ctx.save();
        ctx.translate(x, y);

        // Outer Rotating Ring
        ctx.rotate(rotationAngle);
        ctx.beginPath();
        ctx.arc(0, 0, 48, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(0, 255, 240, 0.85)";
        ctx.lineWidth = 2;
        ctx.setLineDash([12, 8]);
        ctx.stroke();

        // Inner Red Targeting Brackets
        ctx.rotate(-rotationAngle * 2.2);
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 3;
        ctx.setLineDash([20, 15]);
        ctx.stroke();

        ctx.restore();

        // Center Lock Crosshairs
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ff0055";
        ctx.shadowBlur = 10;
        ctx.fill();

        ctx.beginPath();
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.moveTo(x - 20, y); ctx.lineTo(x - 8, y);
        ctx.moveTo(x + 8, y);  ctx.lineTo(x + 20, y);
        ctx.moveTo(x, y - 20); ctx.lineTo(x, y - 8);
        ctx.moveTo(x, y + 8);  ctx.lineTo(x, y + 20);
        ctx.stroke();

        // Target Text Tag
        ctx.font = "bold 11px monospace";
        ctx.fillStyle = "#00fff0";
        ctx.fillText("TARGET_LOCKED", x + 35, y + 4);
    }

    function drawEffects() {
        // 1. Draw Laser Beams
        for (let i = lasers.length - 1; i >= 0; i--) {
            const l = lasers[i];
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(l.x1, l.y1);
            ctx.lineTo(l.x2, l.y2);
            ctx.strokeStyle = `rgba(255, 255, 255, ${l.alpha})`;
            ctx.lineWidth = l.width;
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 20;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(l.x1, l.y1);
            ctx.lineTo(l.x2, l.y2);
            ctx.strokeStyle = `rgba(255, 0, 85, ${l.alpha})`;
            ctx.lineWidth = l.width * 2;
            ctx.stroke();
            ctx.restore();

            l.alpha -= 0.12;
            l.width *= 0.8;
            if (l.alpha <= 0) lasers.splice(i, 1);
        }

        // 2. Draw Shockwaves
        for (let i = shockwaves.length - 1; i >= 0; i--) {
            const sw = shockwaves[i];
            sw.radius += 6;
            sw.alpha -= 0.04;

            if (sw.alpha <= 0) {
                shockwaves.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
            ctx.strokeStyle = sw.color;
            ctx.globalAlpha = sw.alpha;
            ctx.lineWidth = sw.strokeWidth;
            ctx.shadowColor = sw.color;
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.restore();
        }

        // 3. Draw Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            ctx.fill();
            ctx.restore();
        }

        // 4. Draw Floating Damage Text
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            const ft = floatingTexts[i];
            ft.y += ft.vy;
            ft.alpha -= 0.02;

            if (ft.alpha <= 0) {
                floatingTexts.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.globalAlpha = ft.alpha;
            ctx.font = "900 22px Arial, sans-serif";
            ctx.fillStyle = "#ffee00";
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 10;
            ctx.textAlign = "center";
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    }

    // Listeners
    shootBtn.addEventListener("click", triggerBlast);
    window.addEventListener("keydown", (e) => {
        if (e.code === "Space") triggerBlast();
    });

    initCameraAI();
</script>
</body>
</html>
